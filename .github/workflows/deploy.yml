name: Deploy to pandit.guru

on:
  push:
    branches: [main]

jobs:
  deploy:
    # The actual build happens on Hostinger's side — this job only fires a
    # webhook — but GitHub still bills a full minute per run regardless.
    # Self-hosted runner minutes aren't metered.
    runs-on: [self-hosted, contabo]
    steps:
      - name: Trigger Hostinger deploy webhook
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"refs/heads/${{ github.ref_name }}\"}" \
            "${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}"
